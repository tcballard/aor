name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - run: rustup override set 1.88.0
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # No local-environment skip here: Unix socket tests are required on CI.
      - run: cargo test --locked --workspace
      - run: python3 scripts/smoke.py
      - run: python3 scripts/database-smoke.py
      - run: python3 scripts/dev-smoke.py
      - run: python3 scripts/check-compile-fail.py
      - run: cargo aor verify --development --json
      - run: cargo aor routes --json
      - run: cargo aor doctor --json
      - name: Public readiness must fail while the specification is incomplete
        run: |
          set +e
          cargo aor verify --json
          code=$?
          test "$code" = 1
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - run: python3 scripts/fuzz.py --seconds 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-evidence
          path: |
            docs/evidence/fuzz*.json
            docs/evidence/fuzz*.log
            fuzz/corpus
            crash-*
            timeout-*
